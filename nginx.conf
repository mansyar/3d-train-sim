# Static PWA server for Tiny Tracks. Single page, SPA fallback, cache rules
# tuned to the service worker: sw.js/manifest/index.html must revalidate so
# updates reach family devices, while hashed build output caches forever.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The header policy lives in one file and is included here and in every
  # location below: a location that declares its own add_header drops a
  # server-level one, which would leave the cacheable responses unprotected.
  include /etc/nginx/conf.d/security-headers.conf;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # Exact matches win over the regex below — these must always revalidate.
  location = /sw.js {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Vite emits content-hashed JS, CSS and font filenames — safe to cache forever.
  location ~* \.(js|css|woff2)$ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unhashed media (train-kit GLBs, audio, icons) cache a week; the service
  # worker precache is the real freshness mechanism for these.
  location ~* \.(glb|gltf|ogg|mp3|png|ico)$ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
