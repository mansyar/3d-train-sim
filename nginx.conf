# Static PWA server for Tiny Tracks. Single page, SPA fallback, cache rules
# tuned to the service worker: sw.js/manifest/index.html must revalidate so
# updates reach family devices, while hashed build output caches forever.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # Exact matches win over the regex below — these must always revalidate.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Vite emits content-hashed JS/CSS filenames — safe to cache forever.
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unhashed media (train-kit GLBs, audio, icons) cache a week; the service
  # worker precache is the real freshness mechanism for these.
  location ~* \.(glb|gltf|ogg|mp3|png|ico)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
