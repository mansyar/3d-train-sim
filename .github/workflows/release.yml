name: Release

# Tag-driven releases (tech-stack.md): merging to main never deploys — only
# cutting a v* tag ships. workflow_dispatch supports a dry run that exercises
# every gate and the image build without publishing or deploying.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — run gates and build, but publish/deploy nothing'
        type: boolean
        default: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tiny-tracks

# Least privilege: gates only reads the repo; publish escalates to
# packages:write in its own block below.
permissions:
  contents: read

# One release at a time — a second tag queues instead of racing publish/deploy.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full gate (biome + typecheck + vitest)
        run: pnpm check

      - name: Install Playwright browsers (WebKit for the iPad profile)
        run: pnpm exec playwright install --with-deps

      - name: E2E smoke (tablet profile)
        run: pnpm exec playwright test

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (push only on real tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via Coolify webhook
        if: github.event_name == 'push'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -X POST "$COOLIFY_WEBHOOK_URL"
